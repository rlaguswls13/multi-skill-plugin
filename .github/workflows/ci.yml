name: Multi-Skill-Plugin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test All Modules & Starters
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run JUnit 5 Tests across all Modules & Starters
      run: ./gradlew test --no-daemon

    - name: Build Standalone JARs for all Modules & Starters
      run: ./gradlew jar --no-daemon

    - name: Verify Standalone JARs Count
      run: |
        MODULE_COUNT=$(find modules -mindepth 1 -maxdepth 1 -type d | wc -l)
        JAR_COUNT=$(find modules -path "*/build/libs/*.jar" ! -name "*-sources.jar" | wc -l)
        echo "Found $MODULE_COUNT modules and $JAR_COUNT standalone JARs."
        if [ "$JAR_COUNT" -lt "$MODULE_COUNT" ]; then
          echo "Expected at least $MODULE_COUNT JARs but found $JAR_COUNT!"
          exit 1
        fi
