name: Multi-Skill-Plugin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test 102 Modules
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run JUnit 5 Tests across all 102 Modules
      run: ./gradlew test --no-daemon

    - name: Build Standalone JARs for all 102 Modules
      run: ./gradlew jar --no-daemon

    - name: Verify 102 Standalone JARs Count
      run: |
        JAR_COUNT=$(find modules -path "*/build/libs/*.jar" ! -name "*-sources.jar" | wc -l)
        echo "Found $JAR_COUNT Standalone JARs."
        if [ "$JAR_COUNT" -ne 102 ]; then
          echo "Expected 102 JARs but found $JAR_COUNT!"
          exit 1
        fi
